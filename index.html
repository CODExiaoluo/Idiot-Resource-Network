    <style>
        :root {
            --primary-bg: #F5E6E8;
            --secondary-bg: #FFDAC1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: '微软雅黑', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
        }

        header {
            text-align: center;
            padding: 20px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            max-width: 1200px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
            background: linear-gradient(120deg, #00ffff, #ff69b4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .resource-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .resource-item {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .resource-item:hover {
            transform: translateY(-5px);
        }

        .resource-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .content {
            padding: 15px;
        }

        .content h3 {
            color: #00ffff;
            margin: 0 0 10px 0;
        }

        .content a {
            display: inline-block;
            background: #00ffff;
            color: #333;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .resource-grid { padding: 10px; }
        }

        /* 移除不必要的图标样式 */
        .iconfont, .icon-website:before {
            display: none;
        }
    </style>
</head>
