<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sister Demo - 笨蛋资源网</title>
    <style>
        :root {
            --primary-bg: #F5E6E8;
            --secondary-bg: #FFDAC1;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: '微软雅黑', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg), var(--secondary-bg));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 800px;
            width: 90%;
            margin: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            margin: 0 0 30px 0;
            font-size: 2.5em;
            background: linear-gradient(120deg, #00ffff, #ff69b4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .note-link {
            display: inline-block;
            background: linear-gradient(45deg, #00ffff, #ff69b4);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.2em;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 20px 0;
        }

        .note-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            color: #666;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #00ffff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 添加装饰元素 */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }

        .decoration::before {
            content: '✦';
            position: absolute;
            font-size: 2em;
            color: rgba(255, 255, 255, 0.6);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰元素 -->
    <div class="decoration" style="top: 10%; left: 10%"></div>
    <div class="decoration" style="top: 20%; right: 15%"></div>
    <div class="decoration" style="bottom: 15%; left: 20%"></div>
    <div class="decoration" style="bottom: 25%; right: 10%"></div>

    <div class="container">
        <h1>Sister Demo</h1>
        <p>欢迎访问我的笔记分享页面</p>
        <!-- 这里的链接后续由你添加 -->
        <a href="#" class="note-link">查看FlowUs笔记</a>
        <br>
        <a href="../index.html" class="back-link">返回首页</a>
    </div>
</body>
</html>
